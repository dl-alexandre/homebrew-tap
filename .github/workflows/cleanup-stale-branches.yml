name: Cleanup Stale Branches

on:
  # Manual trigger
  workflow_dispatch:
  
  # Run weekly on Sundays at 06:00 UTC
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Verify automation token
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN keeps working when the automation token is dead, so it is used
    # to open/update/close the single tracking issue.
    permissions:
      contents: read
      issues: write
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set TAP_APP_CLIENT_ID (or TAP_APP_ID) to switch from the TAP_TOKEN PAT to the app.
      if: ${{ (vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) != '' }}
      # Let the preflight below report a failed mint in the tracking issue.
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        # The action accepts either the Client ID or the numeric App ID here.
        client-id: ${{ vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          scripts/
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Check the automation token works (and the PAT is not about to expire)
      env:
        TOKEN_SOURCE: ${{ (vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) != '' && 'app' || 'pat' }}
        # Once the app is configured, a failed mint must not silently fall back to the PAT.
        TAP_TOKEN: ${{ steps.app-token.outputs.token || ((vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) == '' && secrets.TAP_TOKEN || '') }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 scripts/check-token.py --warn-days 14 --report-issue

  cleanup-homebrew-tap:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set TAP_APP_CLIENT_ID (or TAP_APP_ID) to switch from the TAP_TOKEN PAT to the app.
      if: ${{ (vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) != '' }}
      uses: actions/create-github-app-token@v3
      with:
        # The action accepts either the Client ID or the numeric App ID here.
        client-id: ${{ vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Delete stale update-formulas branches
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}
      run: |
        echo "Fetching branches..."
        branches=$(curl --fail-with-body --silent --show-error -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/branches?per_page=100" | \
          jq -r '.[] | select(.name | startswith("update-formulas-")) | .name')

        deleted=0
        kept=0

        for branch in $branches; do
          # Check if there's an open PR for this branch
          prs=$(curl --fail-with-body --silent --show-error -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:$branch&state=open")
          
          pr_count=$(echo "$prs" | jq 'length')

          if [ "$pr_count" -eq 0 ]; then
            echo "Deleting stale branch: $branch"
            curl --fail-with-body --silent --show-error -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/$branch"
            deleted=$((deleted + 1))
          else
            echo "Keeping branch with open PR: $branch"
            kept=$((kept + 1))
          fi
        done

        echo ""
        echo "Cleanup complete: $deleted deleted, $kept kept"

  cleanup-tool-repos:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      # One repo's failure should not cancel cleanup of the others.
      fail-fast: false
      matrix:
        repo:
          - dl-alexandre/Advance-Commerce-CLI
          - dl-alexandre/cimis-cli
          - dl-alexandre/Apple-Map-Server-CLI
          - dl-alexandre/Google-Drive-CLI
          - dl-alexandre/Apple-Business-Connect-CLI
          - dl-alexandre/App-StoreKit-CLI
          - dl-alexandre/cli-template
          - dl-alexandre/Grokipedia-CLI
          - dl-alexandre/MyMarketNews-CLI
          - dl-alexandre/UniFi-Site-Manager-CLI
          - dl-alexandre/Local-UniFi-CLI
          - dl-alexandre/Google-Play-Developer-CLI
          - dl-alexandre/UPS-CLI
          - dl-alexandre/X-CLI
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set TAP_APP_CLIENT_ID (or TAP_APP_ID) to switch from the TAP_TOKEN PAT to the app.
      if: ${{ (vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) != '' }}
      uses: actions/create-github-app-token@v3
      with:
        # The action accepts either the Client ID or the numeric App ID here.
        client-id: ${{ vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Cleanup stale branches in ${{ matrix.repo }}
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}
      run: |
        echo "Checking ${{ matrix.repo }}..."
        
        # Get all branches
        branches=$(curl --fail-with-body --silent --show-error -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ matrix.repo }}/branches?per_page=100" | \
          jq -r '.[].name')

        for branch in $branches; do
          # Skip protected/default branches
          if [ "$branch" = "master" ] || [ "$branch" = "main" ]; then
            continue
          fi

          # Check if there's an open PR for this branch
          prs=$(curl --fail-with-body --silent --show-error -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ matrix.repo }}/pulls?head=${{ github.repository_owner }}:$branch&state=open")
          
          pr_count=$(echo "$prs" | jq 'length')

          # Check branch age (older than 30 days)
          commit_date=$(curl --fail-with-body --silent --show-error -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ matrix.repo }}/branches/$branch" | \
            jq -r '.commit.commit.committer.date')
          
          if [ "$commit_date" = "null" ] || [ -z "$commit_date" ]; then
            continue
          fi

          commit_timestamp=$(date -d "$commit_date" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$commit_date" +%s 2>/dev/null)
          current_timestamp=$(date +%s)
          age_days=$(( (current_timestamp - commit_timestamp) / 86400 ))

          if [ "$pr_count" -eq 0 ] && [ "$age_days" -gt 30 ]; then
            echo "Deleting stale branch: $branch (${age_days} days old)"
            curl --fail-with-body --silent --show-error -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ matrix.repo }}/git/refs/heads/$branch"
          fi
        done

        echo "Done checking ${{ matrix.repo }}"

  cleanup-releases:
    name: Delete stale draft releases
    runs-on: ubuntu-latest
    needs: [preflight, cleanup-tool-repos]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        repo:
          - dl-alexandre/Advance-Commerce-CLI
          - dl-alexandre/App-StoreKit-CLI
          - dl-alexandre/Apple-Business-Connect-CLI
          - dl-alexandre/Apple-Map-Server-CLI
          - dl-alexandre/cimis-cli
          - dl-alexandre/cli-template
          - dl-alexandre/Google-Drive-CLI
          - dl-alexandre/Google-Play-Developer-CLI
          - dl-alexandre/Grokipedia-CLI
          - dl-alexandre/Local-UniFi-CLI
          - dl-alexandre/MyMarketNews-CLI
          - dl-alexandre/UniFi-Site-Manager-CLI
          - dl-alexandre/UPS-CLI
          - dl-alexandre/X-CLI
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set TAP_APP_CLIENT_ID (or TAP_APP_ID) to switch from the TAP_TOKEN PAT to the app.
      if: ${{ (vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) != '' }}
      uses: actions/create-github-app-token@v3
      with:
        # The action accepts either the Client ID or the numeric App ID here.
        client-id: ${{ vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Delete stale draft releases in ${{ matrix.repo }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}
      run: |
        echo "Checking ${{ matrix.repo }} for stale draft releases..."

        releases_json=$(gh release list --repo ${{ matrix.repo }} --limit 50 --json tagName,isDraft,isLatest)

        latest_tag=$(echo "$releases_json" | jq -r '.[] | select(.isLatest) | .tagName')
        stale_drafts=$(echo "$releases_json" | jq -r --arg latest "$latest_tag" '.[] | select(.isDraft and .tagName != $latest) | .tagName')

        if [ -z "$stale_drafts" ]; then
          echo "  No stale drafts found"
          exit 0
        fi

        deleted=0
        for tag in $stale_drafts; do
          echo "  Deleting stale draft: $tag"
          gh release delete "$tag" --repo ${{ matrix.repo }} --yes
          deleted=$((deleted + 1))
        done

        echo "Cleanup complete: $deleted draft release(s) deleted"
