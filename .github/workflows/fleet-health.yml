name: Fleet Health

on:
  # Manual trigger
  workflow_dispatch:

  # Run weekly on Mondays at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  ci-health:
    name: Check CI Health
    runs-on: ubuntu-latest
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          scripts/
        sparse-checkout-cone-mode: false

    - name: Check for failed CI runs in the last 7 days
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/check-ci-health.sh --days 7 --failed-only

  release-audit:
    name: Audit Releases
    runs-on: ubuntu-latest
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          scripts/
        sparse-checkout-cone-mode: false

    - name: Check for stale drafts and release anomalies
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/check-releases.sh

  formula-coverage:
    name: Check Formula Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .gitmodules
          Formula/
          scripts/
        sparse-checkout-cone-mode: false

    - name: Verify every tool has a formula
      run: |
        ./scripts/check-formula-coverage.sh

  template-drift:
    name: Check Template Drift
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository with tool submodules
      uses: actions/checkout@v6
      with:
        submodules: true
        # Some tool repos are private; the default GITHUB_TOKEN cannot clone them.
        token: ${{ secrets.TAP_TOKEN }}

    - name: Verify tools match the cli-template baseline
      run: |
        ./scripts/check-template-drift.sh
