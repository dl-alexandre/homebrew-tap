name: Fleet Health

on:
  # Manual trigger
  workflow_dispatch:

  # Run weekly on Mondays at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Verify automation token
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN keeps working when the automation token is dead, so it is used
    # to open/update/close the single tracking issue.
    permissions:
      contents: read
      issues: write
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set the TAP_APP_CLIENT_ID variable to switch from the TAP_TOKEN PAT to the app.
      if: ${{ vars.TAP_APP_CLIENT_ID != '' }}
      # Let the preflight below report a failed mint in the tracking issue.
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.TAP_APP_CLIENT_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          scripts/
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Check the automation token works (and the PAT is not about to expire)
      env:
        TOKEN_SOURCE: ${{ vars.TAP_APP_CLIENT_ID != '' && 'app' || 'pat' }}
        # Once the app is configured, a failed mint must not silently fall back to the PAT.
        TAP_TOKEN: ${{ steps.app-token.outputs.token || (vars.TAP_APP_CLIENT_ID == '' && secrets.TAP_TOKEN || '') }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 scripts/check-token.py --warn-days 14 --report-issue

  ci-health:
    name: Check CI Health
    needs: preflight
    runs-on: ubuntu-latest
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set the TAP_APP_CLIENT_ID variable to switch from the TAP_TOKEN PAT to the app.
      if: ${{ vars.TAP_APP_CLIENT_ID != '' }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.TAP_APP_CLIENT_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          .gitmodules
          scripts/
        sparse-checkout-cone-mode: false

    - name: Check for failed CI runs in the last 7 days
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}
      run: |
        ./scripts/check-ci-health.sh --days 7 --failed-only

  release-audit:
    name: Audit Releases
    needs: preflight
    runs-on: ubuntu-latest
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set the TAP_APP_CLIENT_ID variable to switch from the TAP_TOKEN PAT to the app.
      if: ${{ vars.TAP_APP_CLIENT_ID != '' }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.TAP_APP_CLIENT_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          .gitmodules
          scripts/
        sparse-checkout-cone-mode: false

    - name: Check for stale drafts and release anomalies
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}
      run: |
        ./scripts/check-releases.sh

  formula-coverage:
    name: Check Formula Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          .gitmodules
          Formula/
          scripts/
        sparse-checkout-cone-mode: false

    - name: Verify every tool has a formula
      run: |
        ./scripts/check-formula-coverage.sh

  scoop-parity:
    name: Check Scoop Parity
    runs-on: ubuntu-latest
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set the TAP_APP_CLIENT_ID variable to switch from the TAP_TOKEN PAT to the app.
      if: ${{ vars.TAP_APP_CLIENT_ID != '' }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.TAP_APP_CLIENT_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Checkout repository with packaging submodules
      uses: actions/checkout@v7
      with:
        submodules: true
        token: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}

    - name: Verify Scoop manifests match Homebrew formula versions
      run: |
        ./scripts/check-scoop-parity.sh

  template-drift:
    name: Check Template Drift
    needs: preflight
    runs-on: ubuntu-latest
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set the TAP_APP_CLIENT_ID variable to switch from the TAP_TOKEN PAT to the app.
      if: ${{ vars.TAP_APP_CLIENT_ID != '' }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.TAP_APP_CLIENT_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Checkout repository with tool submodules
      uses: actions/checkout@v7
      with:
        submodules: true
        # Some tool repos are private; the default GITHUB_TOKEN cannot clone them.
        token: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}

    - name: Verify tools match the cli-template baseline
      run: |
        ./scripts/check-template-drift.sh
