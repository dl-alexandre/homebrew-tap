name: Fleet Health

on:
  # Manual trigger
  workflow_dispatch:

  # Run weekly on Mondays at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Verify TAP_TOKEN
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN keeps working when TAP_TOKEN is dead, so it is used
    # to open/update/close the single tracking issue.
    permissions:
      contents: read
      issues: write
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          scripts/
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Check TAP_TOKEN is accepted and not about to expire
      env:
        TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 scripts/check-token.py --warn-days 14 --report-issue

  ci-health:
    name: Check CI Health
    needs: preflight
    runs-on: ubuntu-latest
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          .gitmodules
          scripts/
        sparse-checkout-cone-mode: false

    - name: Check for failed CI runs in the last 7 days
      env:
        GH_TOKEN: ${{ secrets.TAP_TOKEN }}
      run: |
        ./scripts/check-ci-health.sh --days 7 --failed-only

  release-audit:
    name: Audit Releases
    needs: preflight
    runs-on: ubuntu-latest
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          .gitmodules
          scripts/
        sparse-checkout-cone-mode: false

    - name: Check for stale drafts and release anomalies
      env:
        GH_TOKEN: ${{ secrets.TAP_TOKEN }}
      run: |
        ./scripts/check-releases.sh

  formula-coverage:
    name: Check Formula Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          .gitmodules
          Formula/
          scripts/
        sparse-checkout-cone-mode: false

    - name: Verify every tool has a formula
      run: |
        ./scripts/check-formula-coverage.sh

  scoop-parity:
    name: Check Scoop Parity
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository with packaging submodules
      uses: actions/checkout@v7
      with:
        submodules: true
        token: ${{ secrets.TAP_TOKEN }}

    - name: Verify Scoop manifests match Homebrew formula versions
      run: |
        ./scripts/check-scoop-parity.sh

  template-drift:
    name: Check Template Drift
    needs: preflight
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository with tool submodules
      uses: actions/checkout@v7
      with:
        submodules: true
        # Some tool repos are private; the default GITHUB_TOKEN cannot clone them.
        token: ${{ secrets.TAP_TOKEN }}

    - name: Verify tools match the cli-template baseline
      run: |
        ./scripts/check-template-drift.sh
