name: Update Formulas

on:
  # Manual trigger
  workflow_dispatch:
  
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Trigger when CLI repos publish releases
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Verify automation token
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN keeps working when the automation token is dead, so it is used
    # to open/update/close the single tracking issue.
    permissions:
      contents: read
      issues: write
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set TAP_APP_CLIENT_ID (or TAP_APP_ID) to switch from the TAP_TOKEN PAT to the app.
      if: ${{ (vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) != '' }}
      # Let the preflight below report a failed mint in the tracking issue.
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        # The action accepts either the Client ID or the numeric App ID here.
        client-id: ${{ vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          scripts/
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Check the automation token works (and the PAT is not about to expire)
      env:
        TOKEN_SOURCE: ${{ (vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) != '' && 'app' || 'pat' }}
        # Once the app is configured, a failed mint must not silently fall back to the PAT.
        TAP_TOKEN: ${{ steps.app-token.outputs.token || ((vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) == '' && secrets.TAP_TOKEN || '') }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 scripts/check-token.py --warn-days 14 --report-issue

  update-formulas:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      pr_created: ${{ steps.update.outputs.pr_created }}
      branch_name: ${{ steps.update.outputs.branch_name }}
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set TAP_APP_CLIENT_ID (or TAP_APP_ID) to switch from the TAP_TOKEN PAT to the app.
      if: ${{ (vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) != '' }}
      uses: actions/create-github-app-token@v3
      with:
        # The action accepts either the Client ID or the numeric App ID here.
        client-id: ${{ vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Checkout tap repository
      uses: actions/checkout@v7
      with:
        # Pushes the formula branch; PRs opened with this token (unlike GITHUB_TOKEN) trigger CI.
        token: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install dependencies
      run: |
        gem install octokit

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Update formulas
      id: update
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}
        TAP_REPO: dl-alexandre/homebrew-tap
        TAP_BRANCH: master
      run: ruby scripts/update-formulas.rb

  # Stale update-formulas-* branches are removed by cleanup-stale-branches.yml (weekly);
  # merged ones are deleted by the repo's delete_branch_on_merge setting.
  test-formulas:
    needs: update-formulas
    # Still test a PR that was opened even if some other formula's lookup failed.
    if: ${{ !cancelled() && needs.update-formulas.outputs.pr_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
    - name: Mint GitHub App token
      id: app-token
      # Set TAP_APP_CLIENT_ID (or TAP_APP_ID) to switch from the TAP_TOKEN PAT to the app.
      if: ${{ (vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID) != '' }}
      uses: actions/create-github-app-token@v3
      with:
        # The action accepts either the Client ID or the numeric App ID here.
        client-id: ${{ vars.TAP_APP_CLIENT_ID || vars.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        # Every repository the app is installed on under this owner, not just the tap.
        owner: ${{ github.repository_owner }}

    - name: Checkout tap repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.update-formulas.outputs.branch_name || github.ref }}

    - name: Set up Homebrew
      uses: Homebrew/actions/setup-homebrew@main

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Discover and test formulas
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.TAP_TOKEN }}
        TEST_REF: ${{ needs.update-formulas.outputs.branch_name || github.ref }}
      run: |
        git fetch origin "$TEST_REF"
        git checkout --force FETCH_HEAD
        git log -1 --oneline

        # Add local tap for testing
        brew tap-new local/tap
        cp Formula/*.rb "$(brew --repo local/tap)/Formula/"
        
        # Dynamically discover all formulas in the Formula directory
        FORMULAS=$(find Formula -name "*.rb" -exec basename {} .rb \; | sort)
        
        # Test each discovered formula
        for formula in $FORMULAS; do
          echo "Testing $formula..."
          ruby -ne 'puts $_ if /version "/ || /url "/' "Formula/$formula.rb"
          repo=$(ruby -ne 'puts Regexp.last_match(1) if /homepage "https:\/\/github\.com\/([^"]+)"/' "Formula/$formula.rb")
          if [ -n "$repo" ] && [ "$(gh repo view "$repo" --json isPrivate --jq .isPrivate 2>/dev/null || echo false)" = "true" ]; then
            echo "Skipping $formula because $repo is private and the formula uses a plain release URL"
            continue
          fi

          brew install local/tap/$formula
          brew test local/tap/$formula
          brew uninstall local/tap/$formula
        done
      working-directory: ${{ github.workspace }}
