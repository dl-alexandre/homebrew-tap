name: Update Formulas

on:
  # Manual trigger
  workflow_dispatch:
  
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Trigger when CLI repos publish releases
  repository_dispatch:
    types: [release-published]

jobs:
  update-formulas:
    runs-on: ubuntu-latest
    outputs:
      pr_created: ${{ steps.update.outputs.pr_created }}
    steps:
    - name: Checkout tap repository
      uses: actions/checkout@v6
      with:
        # TAP_TOKEN requires repo scope and workflow permissions to create pull requests
        # Generate at: https://github.com/settings/tokens with 'repo' and 'workflow' scopes
        token: ${{ secrets.TAP_TOKEN }}

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install dependencies
      run: |
        gem install octokit

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Update formulas
      id: update
      env:
        GITHUB_TOKEN: ${{ secrets.TAP_TOKEN }}
        TAP_REPO: dl-alexandre/homebrew-tap
        TAP_BRANCH: master
      run: ruby scripts/update-formulas.rb

  cleanup-stale-branches:
    needs: [update-formulas, test-formulas]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Enable auto-delete head branches on merge
      env:
        GITHUB_TOKEN: ${{ secrets.TAP_TOKEN }}
      run: |
        curl -s -X PATCH \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/dl-alexandre/homebrew-tap \
          -d '{"delete_branch_on_merge":true}' || true

    - name: Delete stale update-formulas branches
      env:
        GITHUB_TOKEN: ${{ secrets.TAP_TOKEN }}
      run: |
        # Delete update-formulas-* branches whose PRs are merged or closed
        branches=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/dl-alexandre/homebrew-tap/branches?per_page=100" | \
          jq -r '.[] | select(.name | startswith("update-formulas-")) | .name')

        for branch in $branches; do
          # Check if there's an open PR for this branch
          pr_state=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/dl-alexandre/homebrew-tap/pulls?head=dl-alexandre:$branch&state=open" | \
            jq -r '.[0].state // "none"')

          if [ "$pr_state" != "open" ]; then
            echo "Deleting stale branch: $branch"
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/dl-alexandre/homebrew-tap/git/refs/heads/$branch" || true
          else
            echo "Keeping branch with open PR: $branch"
          fi
        done

  test-formulas:
    needs: update-formulas
    if: needs.update-formulas.outputs.pr_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
    - name: Checkout tap repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.ref || github.ref }}

    - name: Set up Homebrew
      uses: Homebrew/actions/setup-homebrew@main

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Discover and test formulas
      env:
        GH_TOKEN: ${{ secrets.TAP_TOKEN }}
      run: |
        # Add local tap for testing
        brew tap-new local/tap
        cp -r Formula $(brew --repo local/tap)/
        
        # Dynamically discover all formulas in the Formula directory
        FORMULAS=$(find Formula -name "*.rb" -exec basename {} .rb \; | sort)
        
        # Test each discovered formula
        for formula in $FORMULAS; do
          echo "Testing $formula..."
          repo=$(ruby -ne 'puts Regexp.last_match(1) if /homepage "https:\/\/github\.com\/([^"]+)"/' "Formula/$formula.rb")
          if [ -n "$repo" ] && [ "$(gh repo view "$repo" --json isPrivate --jq .isPrivate 2>/dev/null || echo false)" = "true" ]; then
            echo "Skipping $formula because $repo is private and the formula uses a plain release URL"
            continue
          fi

          brew install local/tap/$formula
          if command -v $formula &> /dev/null; then
            if ! $formula --version; then
              $formula version
            fi
            brew uninstall local/tap/$formula || true
          fi
        done
      working-directory: ${{ github.workspace }}
