name: Update Formulas

on:
  # Manual trigger
  workflow_dispatch:
  
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Trigger when CLI repos publish releases
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Verify TAP_TOKEN
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN keeps working when TAP_TOKEN is dead, so it is used
    # to open/update/close the single tracking issue.
    permissions:
      contents: read
      issues: write
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          scripts/
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Check TAP_TOKEN is accepted and not about to expire
      env:
        TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 scripts/check-token.py --warn-days 14 --report-issue

  update-formulas:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      pr_created: ${{ steps.update.outputs.pr_created }}
      branch_name: ${{ steps.update.outputs.branch_name }}
    steps:
    - name: Checkout tap repository
      uses: actions/checkout@v7
      with:
        # TAP_TOKEN requires repo scope and workflow permissions to create pull requests
        # Generate at: https://github.com/settings/tokens with 'repo' and 'workflow' scopes
        token: ${{ secrets.TAP_TOKEN }}

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install dependencies
      run: |
        gem install octokit

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Update formulas
      id: update
      env:
        GITHUB_TOKEN: ${{ secrets.TAP_TOKEN }}
        TAP_REPO: dl-alexandre/homebrew-tap
        TAP_BRANCH: master
      run: ruby scripts/update-formulas.rb

  # Stale update-formulas-* branches are removed by cleanup-stale-branches.yml (weekly);
  # merged ones are deleted by the repo's delete_branch_on_merge setting.
  test-formulas:
    needs: update-formulas
    # Still test a PR that was opened even if some other formula's lookup failed.
    if: ${{ !cancelled() && needs.update-formulas.outputs.pr_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
    - name: Checkout tap repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.update-formulas.outputs.branch_name || github.ref }}

    - name: Set up Homebrew
      uses: Homebrew/actions/setup-homebrew@main

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Discover and test formulas
      env:
        GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        TEST_REF: ${{ needs.update-formulas.outputs.branch_name || github.ref }}
      run: |
        git fetch origin "$TEST_REF"
        git checkout --force FETCH_HEAD
        git log -1 --oneline

        # Add local tap for testing
        brew tap-new local/tap
        cp Formula/*.rb "$(brew --repo local/tap)/Formula/"
        
        # Dynamically discover all formulas in the Formula directory
        FORMULAS=$(find Formula -name "*.rb" -exec basename {} .rb \; | sort)
        
        # Test each discovered formula
        for formula in $FORMULAS; do
          echo "Testing $formula..."
          ruby -ne 'puts $_ if /version "/ || /url "/' "Formula/$formula.rb"
          repo=$(ruby -ne 'puts Regexp.last_match(1) if /homepage "https:\/\/github\.com\/([^"]+)"/' "Formula/$formula.rb")
          if [ -n "$repo" ] && [ "$(gh repo view "$repo" --json isPrivate --jq .isPrivate 2>/dev/null || echo false)" = "true" ]; then
            echo "Skipping $formula because $repo is private and the formula uses a plain release URL"
            continue
          fi

          brew install local/tap/$formula
          brew test local/tap/$formula
          brew uninstall local/tap/$formula
        done
      working-directory: ${{ github.workspace }}
